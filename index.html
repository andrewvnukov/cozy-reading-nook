<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- TITLE: держи <title> РОВНО равным названию в консоли (урок модерации п.5.1.3) -->
<title>Книжный Уголок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script>
  window.__inIframe = true;
  try{ window.__inIframe = window.top !== window.self; }catch(e){ window.__inIframe = true; }
  if(!window.__inIframe){ window.__noSDK = true; }
  else {
    var __sdkS = document.createElement('script');
    __sdkS.src = 'https://yandex.ru/games/sdk/v2';
    __sdkS.onerror = function(){ window.__noSDK = true; if(window.__onSdkScriptDone) window.__onSdkScriptDone(); };
    __sdkS.onload  = function(){ if(window.__onSdkScriptDone) window.__onSdkScriptDone(); };
    document.head.appendChild(__sdkS);
  }
</script>
<script src="sfx.js"></script>
<style>
  :root{
    /* ── Токены под тему «дождливый вечер, книжный уголок»: тёплый свет свечи в тёмной комнате ── */
    --ink:#4A3323; --ink-soft:#9C8468; --line:#4A3323;
    --paper:#FFF6E4;
    --accent:#E8955A; --accent-deep:#C97540;
    --gold:#E8B84B; --mint:#7FBFA0; --lav:#8E7FC9; --night:#3A5068;
    --bg:#2B1E17;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);position:fixed;inset:0;background:var(--bg)}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;
       padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
       max-width:560px;margin:0 auto}
  .top{display:flex;gap:8px;align-items:flex-start}
  .chip{background:var(--paper);border:2.5px solid var(--line);border-radius:16px;padding:6px 12px 6px 8px;
        display:flex;gap:8px;align-items:center;box-shadow:0 3px 0 rgba(74,51,35,.35)}
  .chip .ic{width:26px;height:26px;flex:none}
  .chip .tx{display:flex;flex-direction:column;gap:1px}
  .chip .v{font-weight:900;font-size:17px;line-height:1}
  .chip .l{font-size:10px;font-weight:800;color:var(--ink-soft);letter-spacing:.3px}
  .spacer{flex:1}
  #side{position:absolute;right:max(12px,calc(50% - 268px));top:118px;display:flex;flex-direction:column;gap:12px;pointer-events:auto}
  .rbtn{width:52px;height:52px;border-radius:50%;background:var(--paper);border:2.5px solid var(--line);
        box-shadow:0 3px 0 rgba(74,51,35,.35);display:flex;align-items:center;justify-content:center;
        cursor:pointer;transition:transform .08s,box-shadow .08s;padding:0}
  .rbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(74,51,35,.35)}
  .rbtn svg{width:27px;height:27px;display:block}
  .rbtn .langTxt{font-weight:900;font-size:13px;color:var(--ink)}
  .bottom{display:flex;gap:10px;pointer-events:auto}
  .abtn{flex:1;background:var(--paper);border:2.5px solid var(--line);border-radius:16px;padding:10px 8px;
        font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 3px 0 rgba(74,51,35,.35);
        transition:transform .08s,box-shadow .08s;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff}
  .abtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(74,51,35,.35)}
  .abtn .bt{font-size:15px;line-height:1.05}
  .abtn .bs{font-size:11px;font-weight:800;opacity:.92;display:flex;align-items:center;gap:3px}
  .abtn .bs svg{width:12px;height:12px}
  .abtn.blue{background:var(--night);border-color:#233A4E}
  .abtn.lav{background:var(--lav);border-color:#6857A0}
  .abtn.off{filter:grayscale(.55) brightness(.92)}
  /* ── модалка (магазин книг/улучшения/полка) ── */
  #modal{position:absolute;inset:0;background:rgba(20,12,8,.6);display:flex;align-items:flex-end;
         justify-content:center;pointer-events:auto;z-index:5;transition:opacity .2s}
  #modal.hidden{opacity:0;pointer-events:none}
  .sheet{position:relative;background:linear-gradient(180deg,#FFFDF5,#FBF1DA);width:100%;max-width:560px;
         border:3px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;
         padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:85%;
         display:flex;flex-direction:column;box-shadow:0 -6px 24px rgba(20,12,8,.35)}
  #mScroll{overflow-y:auto;overflow-x:hidden}
  #mTitle{font-weight:900;font-size:20px;text-align:center;margin:2px 44px 12px;color:var(--ink)}
  #mClose{position:absolute;top:10px;right:12px;width:38px;height:38px;border-radius:50%;z-index:2;
          background:var(--paper);border:2.5px solid var(--line);font-size:21px;font-weight:900;
          color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(74,51,35,.35)}
  #mClose:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(74,51,35,.35)}
  .row{display:flex;align-items:center;gap:10px;background:#FFF8E6;border:2.5px solid var(--line);
       border-radius:16px;padding:9px 10px;margin-bottom:9px;box-shadow:0 2px 0 rgba(74,51,35,.22)}
  .row .thumb{width:52px;height:52px;flex:none}
  .row .info{flex:1;min-width:0}
  .row .nm{font-weight:900;font-size:15px;line-height:1.1}
  .row .ds{font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-top:1px}
  .buy{border:2.5px solid var(--accent-deep);background:var(--accent);color:#fff;font-weight:900;
       font-size:13px;padding:8px 12px;border-radius:12px;cursor:pointer;white-space:nowrap;
       box-shadow:0 2px 0 rgba(74,51,35,.3);flex:none}
  .buy:active{transform:translateY(1px)}
  .buy.can-not{background:#CFC7B4;border-color:#B3AB98;color:#7C7462}
  .buy.owned{background:var(--mint);border-color:#5A9C7E}
  .coll{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .card{background:#FFF8E6;border:2.5px solid var(--line);border-radius:14px;padding:8px 4px 6px;
        text-align:center;box-shadow:0 2px 0 rgba(74,51,35,.22)}
  .card canvas{width:60px;height:74px;display:block;margin:0 auto}
  .card .cn{font-weight:900;font-size:11.5px;margin-top:3px}
  .card.locked{opacity:.72}
  .card .qm{font-weight:900;font-size:30px;color:var(--ink-soft);height:74px;line-height:74px}
  #toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);
         background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:9px 16px;border-radius:99px;
         opacity:0;transition:.25s;pointer-events:none;z-index:8;text-align:center;max-width:88%}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body oncontextmenu="return false">
<canvas id="cv"></canvas>
<div id="hud">
  <div class="top">
    <div class="chip">
      <svg class="ic" viewBox="0 0 26 26"><path d="M13 3l1.6 5.1 5.3.1-4.3 3.2 1.6 5.1-4.2-3.1-4.2 3.1 1.6-5.1L6.1 8.2l5.3-.1z" fill="#F2C14E" stroke="#4A3323" stroke-width="2.2" stroke-linejoin="round"/></svg>
      <span class="tx"><span class="v" id="coinsV">0</span><span class="l" id="coinsL">ИСКРЫ</span></span>
    </div>
    <div class="chip">
      <svg class="ic" viewBox="0 0 26 26"><path d="M6 20V7c0-1 1-2 2-2h11v15H8c-1 0-2-1-2-2z" fill="#E8955A" stroke="#4A3323" stroke-width="2.2" stroke-linejoin="round"/><path d="M6 20c0-1 1-2 2-2h11" fill="none" stroke="#4A3323" stroke-width="2"/></svg>
      <span class="tx"><span class="v" id="ipsV">0/с</span><span class="l" id="ipsL">ДОХОД</span></span>
    </div>

  </div>
  <div class="spacer"></div>
  <div class="bottom">
    <button class="abtn blue" id="giftBtn"><span class="bt" id="giftT">Подарок</span><span class="bs"><svg viewBox="0 0 12 12"><path d="M2 4h8v6H2z" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M6 2v8M2 4l4 0 4 0" stroke="#fff" stroke-width="1.4"/></svg><span id="giftS">+50</span></span></button>
    <button class="abtn lav" id="x2Btn"><span class="bt" id="x2T">Искры ×2</span><span class="bs"><svg viewBox="0 0 12 12"><path d="M3 2l7 4-7 4z" fill="#fff"/></svg><span id="x2S">5 мин</span></span></button>
  </div>
</div>
<div id="side">
  <button class="rbtn" id="shopBtn" aria-label="Новая книга">
    <svg viewBox="0 0 27 27"><path d="M5 6c2-1.5 5-1.5 7 0v15c-2-1.5-5-1.5-7 0z" fill="#E8955A" stroke="#4A3323" stroke-width="2"/><path d="M22 6c-2-1.5-5-1.5-7 0v15c2-1.5 5-1.5 7 0z" fill="#F2C88A" stroke="#4A3323" stroke-width="2"/></svg>
  </button>
  <button class="rbtn" id="upBtn" aria-label="Улучшения">
    <svg viewBox="0 0 27 27"><path d="M13.5 4l2.3 4.9 5.2.6-3.9 3.6 1.1 5.2-4.7-2.7-4.7 2.7 1.1-5.2L6 9.5l5.2-.6z" fill="#F2C14E" stroke="#4A3323" stroke-width="2.1" stroke-linejoin="round"/></svg>
  </button>
  <button class="rbtn" id="collBtn" aria-label="Полка книг">
    <svg viewBox="0 0 27 27"><rect x="4" y="5" width="4.4" height="17" fill="#8E7FC9" stroke="#4A3323" stroke-width="1.8"/><rect x="9.4" y="5" width="4.4" height="17" fill="#7FBFA0" stroke="#4A3323" stroke-width="1.8"/><rect x="14.8" y="5" width="4.4" height="17" fill="#E8955A" stroke="#4A3323" stroke-width="1.8"/><rect x="20.2" y="5" width="3" height="17" fill="#E8B84B" stroke="#4A3323" stroke-width="1.8"/></svg>
  </button>
  <button class="rbtn" id="langBtn" aria-label="Язык"><span class="langTxt" id="langTxt">RU</span></button>
</div>
<div id="modal" class="hidden"><div class="sheet"><button id="mClose">×</button><div id="mTitle"></div><div id="mScroll"><div id="mBody"></div></div></div></div>
<div id="toast"></div>
<script>
'use strict';
// ============================================================
//  Книжный Уголок / Cozy Reading Nook — idle-коллекционер про домашний
//  книжный уголок дождливым вечером. Петля: переворачивать страницы
//  открытой книги (тап-доход) -> накопить искры вдохновения -> поставить
//  НОВУЮ именную книгу на полку (пассивный доход + коллекция) -> апгрейды.
// ============================================================
const SAVE_KEY = "cozy_reading_nook_v1";   // GAME: уникальный ключ сейва
const LB_NAME  = "shelf_best";              // техимя лидерборда (рекорд = число книг)
let ysdk=null, player=null, lb=null, saveT=0, booted=false;

// ---------- i18n (ручной выбор + авто-язык через SDK) ----------
function lang(){
  try{ if(S && (S.lang==="ru"||S.lang==="en")) return S.lang; }catch(e){}
  try{ if(ysdk&&ysdk.environment&&ysdk.environment.i18n&&ysdk.environment.i18n.lang)
    return ysdk.environment.i18n.lang==="ru"?"ru":"en"; }catch(e){}
  return (navigator.language||"ru").slice(0,2)==="ru"?"ru":"en";
}
function toggleLang(){
  S.lang = lang()==="ru" ? "en" : "ru";
  document.documentElement.setAttribute("lang", S.lang);
  refreshHud(); persist(true); sfx("tap");
}
const STR = {
  coins:{ru:"ИСКРЫ",en:"SPARKS"}, income:{ru:"ДОХОД",en:"INCOME"},
  gift:{ru:"Подарок",en:"Gift"},
  x2:{ru:"Искры ×2",en:"Sparks ×2"}, x2on:{ru:"×2 идёт",en:"×2 active"},
  need:{ru:"Не хватает искр",en:"Not enough sparks"},
  shopTitle:{ru:"Новая книга",en:"Add a book"},
  upTitle:{ru:"Улучшения уголка",en:"Nook upgrades"},
  collTitle:{ru:"Полка книг",en:"Bookshelf"},
  buy:{ru:"Добавить",en:"Add"}, owned:{ru:"На полке",en:"Owned"},
  lvl:{ru:"Ур.",en:"Lv."},
  upFinger:{ru:"Быстрые пальцы",en:"Nimble Fingers"}, upFingerD:{ru:"+1 искра за переворот",en:"+1 spark per flip"},
  upBlanket:{ru:"Тёплый плед",en:"Cozy Blanket"}, upBlanketD:{ru:"+25% к пассивному доходу",en:"+25% passive income"},
  upInk:{ru:"Дешёвые чернила",en:"Cheap Ink"}, upInkD:{ru:"−5% к цене новых книг",en:"−5% new book price"},
  ipsUnit:{ru:"иск/с",en:"sp/s"},
  daily:{ru:"Ежедневный подарок:",en:"Daily gift:"},
  x2got:{ru:"Искры удвоены на 5 минут!",en:"Sparks doubled for 5 min!"},
  giftGot:{ru:"Подарок:",en:"Gift:"},
  newBook:{ru:"Новая книга:",en:"New book:"},
  allBooks:{ru:"Все книги на полке!",en:"All books collected!"},
  hintTap:{ru:"Тапни по книге, чтобы читать",en:"Tap the book to read"},
};
const T = k => (STR[k]||{})[lang()] || (STR[k]||{}).ru || k;
const nm = it => lang()==="ru"? it.ru : it.en;

// ---------- обязательные цветовые хелперы (RUNBOOK «Модельки: стандарт качества») ----------
function hexRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; }
function shade(hex, amt){
  const [r,g,b]=hexRgb(hex);
  const f=v=>Math.max(0,Math.min(255,Math.round(amt>=0 ? v+(255-v)*amt : v*(1+amt))));
  return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}
function rgba(hex, a){ const [r,g,b]=hexRgb(hex); return 'rgba('+r+','+g+','+b+','+a+')'; }

// ---------- Книги коллекции (0-й — стартовая, уже на полке) ----------
const BOOKS = [
  {id:'diary',   ru:'Дневник «Тайны»',            en:'Diary "Secrets"',          base:'#8A5A3A', accent:'#E8B84B', shape:'lock',    ips:1,    cost:0},
  {id:'tales',   ru:'Сказки «Лунный свет»',       en:'Tales "Moonlight"',        base:'#5A6BA8', accent:'#F2C14E', shape:'moon',    ips:3,    cost:30},
  {id:'atlas',   ru:'Атлас «Горизонт»',           en:'Atlas "Horizon"',          base:'#3E8F7A', accent:'#F2E4B8', shape:'compass', ips:9,    cost:150},
  {id:'herb',    ru:'Травник «Зелёный шёпот»',    en:'Herbarium "Green Whisper"',base:'#5B9C4E', accent:'#E8955A', shape:'leaf',    ips:24,   cost:560},
  {id:'poetry',  ru:'Поэзия «Тихий дождь»',       en:'Poetry "Quiet Rain"',      base:'#4F7FA8', accent:'#DCEEF5', shape:'drop',    ips:60,   cost:1800},
  {id:'sea',     ru:'Судовой журнал «На юг»',     en:'Sea Log "Southward"',      base:'#2F6E8C', accent:'#E8B84B', shape:'anchor',  ips:140,  cost:5200},
  {id:'stars',   ru:'Атлас звёзд «Млечный путь»', en:'Star Atlas "Milky Way"',   base:'#2B2B54', accent:'#F2E4B8', shape:'stars',   ips:320,  cost:15000},
  {id:'recipe',  ru:'Рецепты «Тёплая печь»',      en:'Recipes "Warm Oven"',      base:'#B0562E', accent:'#F2C14E', shape:'whisk',   ips:720,  cost:44000},
  {id:'dream',   ru:'Дневник снов «Полночь»',     en:'Dream Journal "Midnight"', base:'#4A3A78', accent:'#8E7FC9', shape:'cloud',   ips:1600, cost:120000},
];
const BK = id => BOOKS.find(b=>b.id===id);

// ---------- Состояние ----------
function fresh(){ return {
  v:1, coins:0,
  books:['diary'], seen:['diary'],          // на полке / когда-либо открытые (коллекция)
  finger:0, blanket:0, ink:0,                // уровни апгрейдов
  best:1,                                    // рекорд числа книг (лидерборд)
  x2Until:0, lastGift:0, lastDaily:"",
  lang:null, hintShown:false,
  time:Date.now()
};}
let S = fresh();

// ---------- Экономика ----------
const x2On     = () => Date.now() < S.x2Until;
const tapGain  = () => 1 + S.finger;
const blanketMult = () => 1 + 0.25*S.blanket;
const ipsBase  = () => S.books.reduce((a,id)=>a + BK(id).ips, 0);
const ips      = () => Math.floor(ipsBase() * blanketMult() * (x2On()?2:1));
const priceMult= () => Math.max(0.5, 1 - 0.05*S.ink);
const bookCost = b => Math.max(1, Math.floor(b.cost * priceMult()));
const nextBook = () => BOOKS.find(b=> !S.books.includes(b.id));
const fingerCost  = () => Math.floor(25 * Math.pow(1.7, S.finger));
const blanketCost = () => Math.floor(70 * Math.pow(1.8, S.blanket));
const inkCost      = () => Math.floor(90 * Math.pow(1.9, S.ink));
// для базового тест-хука: lvl = число книг, upCost = цена следующей книги
const upCost   = () => { const n=nextBook(); return n? bookCost(n) : 0; };

// ---------- Сейвы (throttle + облако, фолбэк localStorage) ----------
function persist(force){
  const t=Date.now();
  if(!force && t-saveT<10000) return;
  saveT=t;
  const raw=JSON.stringify(S);
  try{ localStorage.setItem(SAVE_KEY,raw); }catch(e){}
  if(player){ try{ player.setData({save:raw}); }catch(e){} }
}
function restore(raw){
  if(!raw) return;
  try{ const d=(typeof raw==="string")?JSON.parse(raw):(raw.save?JSON.parse(raw.save):raw);
       if(d&&typeof d==="object") S=Object.assign(fresh(),d); }catch(e){}
  if(!Array.isArray(S.books)||!S.books.length) S.books=['diary'];
  if(!Array.isArray(S.seen)) S.seen=S.books.slice();
  S.books.forEach(id=>{ if(!S.seen.includes(id)) S.seen.push(id); });
}

// ---------- Реклама (no-op вне платформы; награда всегда выдаётся) ----------
let lastAd=0;
function maybeInterstitial(){
  if(!ysdk) return;
  if(Date.now()-lastAd < 180000) return;
  lastAd=Date.now();
  try{ ysdk.adv.showFullscreenAdv({}); }catch(e){}
}
function showRewarded(onReward){
  if(!ysdk){ onReward(); return; }
  try{ ysdk.adv.showRewardedVideo({callbacks:{ onRewarded:onReward, onError:onReward, onClose:()=>{} }}); }
  catch(e){ onReward(); }
}

// ---------- Лидерборд ----------
function submitScore(v){ try{ if(lb&&LB_NAME) lb.setLeaderboardScore(LB_NAME, Math.floor(v)); }catch(e){} }

// ---------- HUD ----------
const $ = id => document.getElementById(id);
const fmt = n => n>=1e6 ? (n/1e6).toFixed(2)+"M" : n>=1e4 ? (n/1e3).toFixed(1)+"K" : Math.floor(n).toString();
function refreshHud(){
  $("coinsV").textContent = fmt(S.coins);
  $("ipsV").textContent   = fmt(ips())+"/"+(lang()==="ru"?"с":"s");
  $("coinsL").textContent = T("coins");
  $("ipsL").textContent   = T("income");
  $("giftT").textContent  = T("gift");
  $("giftS").textContent  = "+"+fmt(giftAmt());
  const on=x2On();
  $("x2T").textContent    = on? T("x2on") : T("x2");
  $("x2S").textContent    = on? Math.ceil((S.x2Until-Date.now())/60000)+(lang()==="ru"?" мин":" min") : (lang()==="ru"?"5 мин":"5 min");
  $("x2Btn").classList.toggle("off", on);
  $("langTxt").textContent = lang()==="ru"?"RU":"EN";
  document.documentElement.setAttribute("lang", lang());
  if(modalOpen) buildModal(modalOpen); // живое обновление цен в открытой панели
}
let toastT;
function toast(msg){ const el=$("toast"); el.textContent=msg; el.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),1600); }

// ---------- Награды ----------
const giftAmt = () => Math.max(50, Math.floor(ips()*45));

// ---------- Действия ----------
function doFlip(){
  S.coins += tapGain();
  triggerFlip();
  refreshHud(); persist(); sfx("tap");
}
function buyBook(id){
  const b=BK(id); if(!b || S.books.includes(id)) return false;
  const c=bookCost(b);
  if(S.coins<c){ toast(T("need")); sfx("error"); return false; }
  S.coins-=c; S.books.push(id);
  if(!S.seen.includes(id)) S.seen.push(id);
  S.best=Math.max(S.best,S.books.length);
  refreshHud(); persist(true); submitScore(S.best); maybeInterstitial(); sfx("buy");
  toast(T("newBook")+" "+nm(b)); return true;
}
function buyUp(key){
  const map={finger:fingerCost,blanket:blanketCost,ink:inkCost};
  const c=map[key](); if(S.coins<c){ toast(T("need")); sfx("error"); return false; }
  S.coins-=c; S[key]++; refreshHud(); persist(true); sfx("buy"); return true;
}
function claimGift(){
  showRewarded(()=>{ const g=giftAmt(); S.coins+=g; refreshHud(); persist(true); sfx("coin");
    toast(T("giftGot")+" +"+fmt(g)); });
}
function claimX2(){
  if(x2On()){ toast(T("x2on")); return; }
  showRewarded(()=>{ S.x2Until=Date.now()+300000; refreshHud(); persist(true); sfx("buy");
    toast(T("x2got")); });
}
function checkDaily(){
  const today=new Date().toISOString().slice(0,10);
  if(S.lastDaily!==today){
    S.lastDaily=today; const g=Math.max(60, Math.floor(ips()*60));
    S.coins+=g; persist(true);
    setTimeout(()=>toast(T("daily")+" +"+fmt(g)), 700);
  }
}

// ---------- Модалки: магазин книг / улучшения / полка ----------
let modalOpen=null;
function openModal(kind){ modalOpen=kind; buildModal(kind); $("modal").classList.remove("hidden"); }
function closeModal(){ modalOpen=null; $("modal").classList.add("hidden"); }
function bookThumb(b, w, h){
  const c=document.createElement('canvas'); c.width=w*2; c.height=h*2;
  const g=c.getContext('2d'); g.scale(2,2); drawBookCover(g,b,w/2,h/2,w*0.72,h*0.86,-0.05); return c;
}
function buildModal(kind){
  const body=$("mBody"); const can=(cost)=>S.coins>=cost;
  if(kind==='shop'){
    $("mTitle").textContent=T("shopTitle"); body.innerHTML="";
    if(!nextBook()){ const p=document.createElement('div'); p.className="ds"; p.style.textAlign="center"; p.textContent=T("allBooks"); body.appendChild(p); }
    BOOKS.forEach(b=>{
      const owned=S.books.includes(b.id);
      const row=document.createElement('div'); row.className="row";
      const th=bookThumb(b,52,52); th.className="thumb"; row.appendChild(th);
      const info=document.createElement('div'); info.className="info";
      info.innerHTML='<div class="nm">'+nm(b)+'</div><div class="ds">+'+fmt(b.ips)+' '+T("ipsUnit")+'</div>';
      row.appendChild(info);
      const btn=document.createElement('button');
      if(owned){ btn.className="buy owned"; btn.textContent=T("owned"); }
      else{ const c=bookCost(b); btn.className="buy"+(can(c)?"":" can-not");
        btn.textContent=T("buy")+" · "+fmt(c);
        btn.onclick=()=>{ if(buyBook(b.id)) buildModal('shop'); }; }
      row.appendChild(btn); body.appendChild(row);
    });
  } else if(kind==='up'){
    $("mTitle").textContent=T("upTitle"); body.innerHTML="";
    const ups=[
      {k:'finger',  ic:'<circle cx="26" cy="22" r="9" fill="#E8955A" stroke="#4A3323" stroke-width="2.4"/><path d="M20 18l4 4 6-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>', c:fingerCost()},
      {k:'blanket', ic:'<rect x="16" y="16" width="20" height="14" rx="3" fill="#8E7FC9" stroke="#4A3323" stroke-width="2.2"/><path d="M16 23h20M22 16v14M30 16v14" stroke="#4A3323" stroke-width="1.6"/>', c:blanketCost()},
      {k:'ink',     ic:'<path d="M26 14c5 5 6 10 0 16-6-6-5-11 0-16z" fill="#3E8F7A" stroke="#4A3323" stroke-width="2.2" stroke-linejoin="round"/>', c:inkCost()},
    ];
    ups.forEach(u=>{
      const row=document.createElement('div'); row.className="row";
      const th=document.createElement('div'); th.className="thumb";
      th.innerHTML='<svg viewBox="0 0 52 44" width="52" height="52">'+u.ic+'</svg>'; row.appendChild(th);
      const info=document.createElement('div'); info.className="info";
      info.innerHTML='<div class="nm">'+T('up'+u.k.charAt(0).toUpperCase()+u.k.slice(1))+' · '+T("lvl")+(S[u.k]+1)+'</div>'
        +'<div class="ds">'+T('up'+u.k.charAt(0).toUpperCase()+u.k.slice(1)+'D')+'</div>';
      row.appendChild(info);
      const b=document.createElement('button'); b.className="buy"+(can(u.c)?"":" can-not");
      b.textContent=fmt(u.c);
      b.onclick=()=>{ if(buyUp(u.k)) buildModal('up'); };
      row.appendChild(b); body.appendChild(row);
    });
  } else if(kind==='coll'){
    $("mTitle").textContent=T("collTitle")+" ("+S.seen.length+"/"+BOOKS.length+")"; body.innerHTML="";
    const grid=document.createElement('div'); grid.className="coll";
    BOOKS.forEach(b=>{
      const seen=S.seen.includes(b.id);
      const card=document.createElement('div'); card.className="card"+(seen?"":" locked");
      if(seen){
        const th=bookThumb(b,60,74); card.appendChild(th);
        const n=document.createElement('div'); n.className="cn"; n.textContent=nm(b); card.appendChild(n);
      } else {
        const q=document.createElement('div'); q.className="qm"; q.textContent="?"; card.appendChild(q);
        const n=document.createElement('div'); n.className="cn"; n.textContent="—"; card.appendChild(n);
      }
      grid.appendChild(card);
    });
    body.appendChild(grid);
  }
}

// ---------- Canvas ----------
const cv=$("cv"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1;
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
let INK="#4A3323", PAPER="#FFF6E4";
let bgCan=null;
// зоны сцены (пересчитываются в resize)
let winCX=0,winCY=0,winR=0, shelfY=0,shelfX0=0,shelfX1=0, bookCX=0,bookCY=0,bookScale=1,
    candleX=0,candleY=0, catX=0,catY=0, rugY=0;
function bookSlot(i){ const n=BOOKS.length; const t = n>1? i/(n-1) : 0; return { x: shelfX0+(shelfX1-shelfX0)*t, y: shelfY }; }
function resize(){
  DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  INK=cssVar("--ink")||INK; PAPER=cssVar("--paper")||PAPER;
  winCX=W*0.5; winCY=H*0.15; winR=Math.min(W,H)*0.13;
  shelfY=H*0.33; shelfX0=W*0.10; shelfX1=W*0.78;
  bookCX=W*0.46; bookCY=H*0.60; bookScale=Math.min(W,H)*0.0034;
  candleX=W*0.80; candleY=H*0.66;
  catX=W*0.16; catY=H*0.80;
  rugY=H*0.80;
  buildScenery(); buildBg();
}
addEventListener("resize",resize);

// ---------- Живой мир: дождь, светлячок свечи, кот, пар от чая ----------
let raindrops=[], steam=[], fireflyDust=[];
function rr(a,b){ return a+(b-a)*Math.random(); }
function buildScenery(){
  raindrops=[]; for(let i=0;i<26;i++) raindrops.push({ x:rr(-winR*0.9,winR*0.9), y:rr(-winR,winR), sp:rr(40,90), len:rr(10,22) });
  steam=[]; for(let i=0;i<8;i++) steam.push({ ph:rr(0,6.28), sp:rr(0.5,0.9) });
  fireflyDust=[]; for(let i=0;i<10;i++) fireflyDust.push({ x:rr(W*0.2,W*0.9), y:rr(H*0.2,H*0.75), ph:rr(0,6.28), sp:rr(0.2,0.5) });
}
function buildBg(){
  bgCan=document.createElement('canvas'); bgCan.width=Math.max(1,W*DPR); bgCan.height=Math.max(1,H*DPR);
  const g=bgCan.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  // стена — тёплый градиент, темнее у потолка, теплее у пола (свет свечи снизу)
  const wg=g.createLinearGradient(0,0,0,H);
  wg.addColorStop(0,'#241811'); wg.addColorStop(0.55,'#3B2A1F'); wg.addColorStop(1,'#4A3526');
  g.fillStyle=wg; g.fillRect(0,0,W,H);
  // мягкое сияние от свечи снизу-справа
  const glow=g.createRadialGradient(candleX,candleY,4,candleX,candleY,H*0.55);
  glow.addColorStop(0,'rgba(255,200,120,.22)'); glow.addColorStop(1,'rgba(255,200,120,0)');
  g.fillStyle=glow; g.fillRect(0,0,W,H);
  // круглое окно — дождливая ночь
  g.save(); g.beginPath(); g.arc(winCX,winCY,winR,0,6.28); g.clip();
  const ng=g.createLinearGradient(0,winCY-winR,0,winCY+winR);
  ng.addColorStop(0,'#1B2A3C'); ng.addColorStop(1,'#3A5068');
  g.fillStyle=ng; g.fillRect(winCX-winR,winCY-winR,winR*2,winR*2);
  // луна
  g.fillStyle='rgba(240,238,220,.9)'; g.beginPath(); g.arc(winCX+winR*0.35,winCY-winR*0.4,winR*0.22,0,6.28); g.fill();
  // дальние крыши/силуэт города под дождём
  g.fillStyle='rgba(15,15,25,.55)';
  g.beginPath(); g.moveTo(winCX-winR,winCY+winR*0.5);
  g.lineTo(winCX-winR*0.6,winCY+winR*0.15); g.lineTo(winCX-winR*0.3,winCY+winR*0.4);
  g.lineTo(winCX,winCY+winR*0.05); g.lineTo(winCX+winR*0.4,winCY+winR*0.35);
  g.lineTo(winCX+winR*0.7,winCY+winR*0.1); g.lineTo(winCX+winR,winCY+winR*0.5);
  g.lineTo(winCX+winR,winCY+winR); g.lineTo(winCX-winR,winCY+winR); g.closePath(); g.fill();
  g.restore();
  // рама окна (толстый чернильный контур + перекладины)
  g.strokeStyle=INK; g.lineWidth=Math.max(5,winR*0.14); g.beginPath(); g.arc(winCX,winCY,winR,0,6.28); g.stroke();
  g.lineWidth=Math.max(3,winR*0.07);
  g.beginPath(); g.moveTo(winCX-winR,winCY); g.lineTo(winCX+winR,winCY); g.stroke();
  g.beginPath(); g.moveTo(winCX,winCY-winR); g.lineTo(winCX,winCY+winR); g.stroke();
  // полка (доска) под окном с прорезями под книги
  const plankH=Math.max(10,H*0.018);
  g.fillStyle=shade('#5C4530',-.1); g.strokeStyle=INK; g.lineWidth=3;
  roundRect(g, shelfX0-14, shelfY, (shelfX1-shelfX0)+28, plankH, 6); g.fill(); g.stroke();
  g.fillStyle='rgba(255,255,255,.10)'; g.fillRect(shelfX0-14, shelfY, (shelfX1-shelfX0)+28, plankH*0.35);
  // пустые слоты-пунктиры для ещё не купленных книг рисуются динамически (список меняется)
  // ковёр
  const rg=g.createRadialGradient(W*0.3,rugY+H*0.08,10,W*0.3,rugY+H*0.08,W*0.5);
  rg.addColorStop(0,'#8E4A3E'); rg.addColorStop(1,'#5E2E26');
  g.fillStyle=rg; g.beginPath(); g.ellipse(W*0.32,rugY+H*0.09,W*0.34,H*0.10,0,0,6.28); g.fill();
  g.strokeStyle='rgba(255,230,200,.35)'; g.lineWidth=2.5;
  g.beginPath(); g.ellipse(W*0.32,rugY+H*0.09,W*0.27,H*0.075,0,0,6.28); g.stroke();
  // кресло (силуэт) под книгой
  g.save();
  const chW=Math.min(W*0.62,340), chH=H*0.30, chX=bookCX, chY=bookCY+H*0.10;
  g.fillStyle=bodyFillStatic(g, chX, chY, chW*0.5, chH*0.5, '#7A4A38');
  roundRect(g, chX-chW/2, chY-chH*0.35, chW, chH, chW*0.16); g.fill();
  g.strokeStyle=INK; g.lineWidth=4; g.stroke();
  // подлокотники
  g.fillStyle=shade('#7A4A38',-.12);
  roundRect(g, chX-chW/2-chW*0.06, chY-chH*0.30, chW*0.16, chH*0.65, chW*0.06); g.fill(); g.stroke();
  roundRect(g, chX+chW/2-chW*0.10, chY-chH*0.30, chW*0.16, chH*0.65, chW*0.06); g.fill(); g.stroke();
  g.restore();
  // столик со свечой/чаем — плоская столешница
  g.fillStyle='#5C4530'; g.strokeStyle=INK; g.lineWidth=3;
  g.beginPath(); g.ellipse(candleX,candleY+H*0.055,W*0.10,H*0.02,0,0,6.28); g.fill(); g.stroke();
  g.fillStyle=shade('#5C4530',-.2);
  g.beginPath(); g.rect(candleX-W*0.008,candleY+H*0.06,W*0.016,H*0.09); g.fill();
  // тонкая внутренняя виньетка-рамка комнаты
  g.strokeStyle='rgba(0,0,0,.25)'; g.lineWidth=Math.max(10,W*0.03);
  g.strokeRect(g.lineWidth/2,g.lineWidth/2,W-g.lineWidth,H-g.lineWidth);
}
function bodyFillStatic(g,cx,cy,rx,ry,base){
  const grad=g.createRadialGradient(cx-rx*0.3,cy-ry*0.5,rx*0.15,cx,cy,Math.max(rx,ry)*1.3);
  grad.addColorStop(0,shade(base,.32)); grad.addColorStop(.55,base); grad.addColorStop(1,shade(base,-.28));
  return grad;
}
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function drawBackground(){ if(bgCan) ctx.drawImage(bgCan,0,0,W,H); }

// ---------- Модельки книг (объём + блик + rim-shade + уникальный силуэт) ----------
function bodyFill(ctx,cx,cy,rx,ry,base){
  const grad=ctx.createRadialGradient(cx-rx*0.3,cy-ry*0.5,rx*0.15,cx,cy,Math.max(rx,ry)*1.2);
  grad.addColorStop(0,shade(base,.4)); grad.addColorStop(.55,base); grad.addColorStop(1,shade(base,-.25));
  return grad;
}
function glossSpot(ctx,cx,cy,r){
  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  grad.addColorStop(0,'rgba(255,255,255,.62)'); grad.addColorStop(1,'rgba(255,255,255,0)');
  return grad;
}
function rimShade(ctx,x,y,w,h){
  const g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,'rgba(20,10,5,0)'); g.addColorStop(1,'rgba(20,10,5,.30)');
  ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
}
function drawBookEmblem(ctx,book,w,h){
  const c=book.accent, ic=shade(book.base,-.4);
  ctx.strokeStyle=ic; ctx.fillStyle=c; ctx.lineWidth=Math.max(1,w*0.028); ctx.lineCap='round'; ctx.lineJoin='round';
  const s=Math.min(w,h)*0.30;
  switch(book.shape){
    case 'lock':
      ctx.beginPath(); ctx.arc(0,-s*0.15,s*0.42,Math.PI,0); ctx.stroke();
      ctx.beginPath(); roundRect(ctx,-s*0.55,-s*0.2,s*1.1,s*0.85,s*0.14); ctx.fill(); ctx.stroke();
      ctx.fillStyle=ic; ctx.beginPath(); ctx.arc(0,s*0.18,s*0.13,0,6.28); ctx.fill();
      break;
    case 'moon':
      ctx.beginPath(); ctx.arc(-s*0.05,0,s*0.5,0.9,5.6); ctx.arc(s*0.18,0,s*0.38,5.6,0.9,true); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle=c; ctx.beginPath();
      for(let i=0;i<5;i++){ const a=-Math.PI/2+i*Math.PI*2/5, r2=i%2?s*0.10:s*0.24;
        const px=s*0.85+Math.cos(a)*r2*0.6, py=-s*0.55+Math.sin(a)*r2*0.6; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      break;
    case 'compass':
      ctx.beginPath(); ctx.arc(0,0,s*0.5,0,6.28); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-s*0.42); ctx.lineTo(s*0.14,0); ctx.lineTo(0,s*0.42); ctx.lineTo(-s*0.14,0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,s*0.06,0,6.28); ctx.fillStyle=ic; ctx.fill();
      break;
    case 'leaf':
      ctx.beginPath(); ctx.moveTo(0,-s*0.55); ctx.quadraticCurveTo(s*0.5,-s*0.1,0,s*0.55); ctx.quadraticCurveTo(-s*0.5,-s*0.1,0,-s*0.55); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-s*0.45); ctx.lineTo(0,s*0.45); ctx.strokeStyle=ic; ctx.lineWidth=Math.max(1,w*0.018); ctx.stroke();
      break;
    case 'drop':
      ctx.beginPath(); ctx.moveTo(0,-s*0.55); ctx.quadraticCurveTo(s*0.5,s*0.1,0,s*0.55); ctx.quadraticCurveTo(-s*0.5,s*0.1,0,-s*0.55); ctx.closePath(); ctx.fill(); ctx.stroke();
      break;
    case 'anchor':
      ctx.beginPath(); ctx.arc(0,-s*0.32,s*0.14,0,6.28); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-s*0.18); ctx.lineTo(0,s*0.5); ctx.moveTo(-s*0.14,-s*0.05); ctx.lineTo(s*0.14,-s*0.05);
      ctx.moveTo(-s*0.36,s*0.28); ctx.quadraticCurveTo(-s*0.36,s*0.55,0,s*0.5);
      ctx.moveTo(s*0.36,s*0.28); ctx.quadraticCurveTo(s*0.36,s*0.55,0,s*0.5); ctx.stroke();
      break;
    case 'stars':
      [[-.3,-.25,.16],[.28,-.1,.12],[0,.35,.14],[.35,.4,.09]].forEach(p=>{
        ctx.beginPath();
        for(let i=0;i<10;i++){ const a=Math.PI/5*i-Math.PI/2, r2=i%2?p[2]*s*0.4:p[2]*s;
          const px=s*p[0]+Math.cos(a)*r2, py=s*p[1]+Math.sin(a)*r2; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
        ctx.closePath(); ctx.fill(); ctx.stroke();
      });
      ctx.beginPath(); ctx.moveTo(-s*0.3,-s*0.25); ctx.lineTo(.28*s,-.1*s); ctx.lineTo(0,.35*s); ctx.lineTo(.35*s,.4*s);
      ctx.strokeStyle=rgba(c,.6); ctx.lineWidth=Math.max(1,w*0.014); ctx.stroke();
      break;
    case 'whisk':
      ctx.beginPath(); ctx.moveTo(0,-s*0.5); ctx.lineTo(0,-s*0.05); ctx.stroke();
      for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(0,-s*0.05); ctx.quadraticCurveTo(i*s*0.4,s*0.15,i*s*0.22,s*0.5); ctx.stroke(); }
      break;
    case 'cloud':
      ctx.beginPath(); ctx.arc(-s*0.2,s*0.05,s*0.28,0,6.28); ctx.arc(s*0.15,-s*0.05,s*0.32,0,6.28); ctx.arc(s*0.4,s*0.1,s*0.22,0,6.28); ctx.fill(); ctx.stroke();
      ctx.fillStyle=c; ctx.beginPath(); ctx.arc(-s*0.35,-s*0.4,s*0.06,0,6.28); ctx.arc(s*0.1,-s*0.5,s*0.08,0,6.28); ctx.fill();
      break;
  }
}
function drawBookCover(ctx,book,cx,cy,w,h,tilt){
  tilt = tilt||0;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(tilt);
  const rx=w/2, ry=h/2, r=Math.min(w,h)*0.12;
  ctx.beginPath(); roundRect(ctx,-rx,-ry,w,h,r);
  ctx.fillStyle=bodyFill(ctx,-rx*0.2,-ry*0.4,rx,ry,book.base);
  ctx.fill();
  ctx.lineWidth=Math.max(1.4,w*0.035); ctx.strokeStyle=INK; ctx.stroke();
  // корешок-ребро
  ctx.fillStyle=shade(book.base,-.18);
  ctx.beginPath(); roundRect(ctx,-rx,-ry,w*0.16,h,r); ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=Math.max(1,w*0.02);
  ctx.beginPath(); ctx.moveTo(-rx+w*0.16,-ry); ctx.lineTo(-rx+w*0.16,ry); ctx.stroke();
  // блик + rim-shade (клип по силуэту)
  ctx.save(); ctx.beginPath(); roundRect(ctx,-rx,-ry,w,h,r); ctx.clip();
  ctx.fillStyle=glossSpot(ctx,-rx*0.05,-ry*0.55,rx*0.55);
  ctx.beginPath(); ctx.ellipse(-rx*0.05,-ry*0.55,rx*0.48,ry*0.28,0,0,6.28); ctx.fill();
  rimShade(ctx,-rx,ry*0.32,w,ry*0.68);
  ctx.restore();
  // ленточка-закладка
  ctx.fillStyle=book.accent;
  ctx.beginPath(); ctx.moveTo(rx*0.5,-ry); ctx.lineTo(rx*0.68,-ry); ctx.lineTo(rx*0.68,ry*0.2);
  ctx.lineTo(rx*0.59,ry*0.04); ctx.lineTo(rx*0.5,ry*0.2); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=Math.max(1,w*0.018); ctx.stroke();
  // эмблема
  ctx.save(); ctx.translate(rx*0.02,ry*0.05); drawBookEmblem(ctx,book,w,h); ctx.restore();
  ctx.restore();
}

// ---------- Полка: расставленные книги ----------
function drawShelf(){
  const plankH=Math.max(10,H*0.018);
  BOOKS.forEach((b,i)=>{
    const p=bookSlot(i);
    const bw=Math.min(38,(shelfX1-shelfX0)/BOOKS.length*0.72), bh=bw*1.32;
    if(S.books.includes(b.id)){
      drawBookCover(ctx,b,p.x,p.y-bh/2-1,bw,bh, (i%2?1:-1)*0.03);
    } else {
      ctx.save(); ctx.strokeStyle='rgba(255,246,228,.32)'; ctx.lineWidth=2; ctx.setLineDash([3,3]);
      roundRect(ctx,p.x-bw*0.36,p.y-bh-1,bw*0.72,bh,4); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    }
  });
}

// ---------- Открытая книга — тап-цель, анимация переворота страницы ----------
let flipT=0, flipping=false, pageSide=0; // pageSide чередуется 0/1 для лёгкого варьирования текста
function triggerFlip(){
  if(flipping) return;
  flipping=true; flipT=0;
  sparkleAt(bookCX, bookCY-6*bookScale*10);
  popup(bookCX, bookCY-14, "+"+tapGain());
}
function updateFlip(dt){
  if(!flipping) return;
  flipT += dt*2.1; // ~0.48s на переворот
  if(flipT>=1){ flipT=0; flipping=false; pageSide=1-pageSide; }
}
function drawOpenBook(t){
  const s=Math.min(W,H)*0.34;
  const cx=bookCX, cy=bookCY, pageW=s*0.42, pageH=s*0.58;
  ctx.save(); ctx.translate(cx,cy);
  // тень книги на кресле
  ctx.fillStyle='rgba(20,10,5,.25)'; ctx.beginPath(); ctx.ellipse(0,pageH*0.62,s*0.62,s*0.12,0,0,6.28); ctx.fill();
  // обложка снизу (тёмно-бордовая, задаёт объём разворота)
  ctx.fillStyle=bodyFill(ctx,0,pageH*0.1,s*0.66,pageH*0.62,'#7A4030');
  ctx.beginPath(); roundRect(ctx,-s*0.66,-pageH*0.06,s*1.32,pageH*0.7,10); ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.stroke();
  // левая страница (статична)
  drawPageHalf(ctx, -pageW, -pageH*0.5, pageW, pageH, 1, pageSide);
  // спинка книги (тень по центру)
  const spine=ctx.createLinearGradient(-6,0,6,0);
  spine.addColorStop(0,'rgba(0,0,0,0)'); spine.addColorStop(0.5,'rgba(0,0,0,.28)'); spine.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=spine; ctx.fillRect(-8,-pageH*0.5,16,pageH);
  // правая страница — статичная (когда не переворачивается) или анимированная
  if(flipping){
    const p=flipT, ang=p*Math.PI;
    const sc=Math.cos(ang); // 1 -> 0 -> -1 (переворот вокруг корешка)
    ctx.save(); ctx.translate(0,0); ctx.scale(sc,1);
    drawPageHalf(ctx, 0, -pageH*0.5, pageW, pageH, sc>=0?1:-1, sc>=0?pageSide:1-pageSide);
    // лёгкая тень сгиба во время переворота
    ctx.fillStyle='rgba(80,50,30,'+(0.25*Math.sin(ang)).toFixed(2)+')';
    ctx.fillRect(0,-pageH*0.5,pageW,pageH);
    ctx.restore();
  } else {
    drawPageHalf(ctx, 0, -pageH*0.5, pageW, pageH, 1, 1-pageSide);
  }
  // корешок-контур поверх
  ctx.strokeStyle=INK; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(0,-pageH*0.5-2); ctx.lineTo(0,pageH*0.5+2); ctx.stroke();
  // закладка сверху
  ctx.fillStyle='#C97540'; ctx.beginPath(); ctx.moveTo(-s*0.08,-pageH*0.5-2); ctx.lineTo(s*0.02,-pageH*0.5-2);
  ctx.lineTo(s*0.02,-pageH*0.5+s*0.22); ctx.lineTo(-s*0.03,-pageH*0.5+s*0.14); ctx.lineTo(-s*0.08,-pageH*0.5+s*0.22); ctx.closePath();
  ctx.fill(); ctx.strokeStyle=INK; ctx.lineWidth=1.4; ctx.stroke();
  ctx.restore();
}
function drawPageHalf(ctx,x,y,w,h,dir,variant){
  ctx.save(); ctx.translate(x,y);
  const g=ctx.createLinearGradient(0,0,dir*w,0);
  g.addColorStop(0,'#FBF2DC'); g.addColorStop(1,'#F0E2C0');
  ctx.fillStyle=g;
  ctx.beginPath();
  if(dir>0) roundRect(ctx,0,0,w,h,8); else roundRect(ctx,0,0,-w,h,8);
  ctx.fill(); ctx.strokeStyle='rgba(74,51,35,.5)'; ctx.lineWidth=1.4; ctx.stroke();
  // строки текста (условные)
  ctx.strokeStyle='rgba(74,51,35,.30)'; ctx.lineWidth=1.6; ctx.lineCap='round';
  const n=6+((variant+1)%3);
  for(let i=0;i<n;i++){
    const ly=h*0.16+i*(h*0.62/n);
    const lw=(0.5+0.35*Math.sin(i*1.7+variant*2.1))*Math.abs(w)*0.7;
    ctx.beginPath(); ctx.moveTo(dir*w*0.12,ly); ctx.lineTo(dir*(w*0.12)+dir*lw,ly); ctx.stroke();
  }
  ctx.restore();
}

// ---------- Дождь на окне, свеча, кот, пар от чая ----------
function drawRain(t,dt){
  ctx.save(); ctx.beginPath(); ctx.arc(winCX,winCY,winR-4,0,6.28); ctx.clip();
  ctx.strokeStyle='rgba(210,225,240,.55)'; ctx.lineWidth=1.6; ctx.lineCap='round';
  raindrops.forEach(d=>{
    d.y += d.sp*dt;
    if(d.y > winR){ d.y=-winR; d.x=rr(-winR*0.9,winR*0.9); }
    const x=winCX+d.x, y=winCY+d.y;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-2,y+d.len); ctx.stroke();
  });
  ctx.restore();
}
function drawCandle(t){
  ctx.save(); ctx.translate(candleX,candleY);
  // подсвечник
  ctx.fillStyle=shade('#C9973E',-.1); ctx.strokeStyle=INK; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.ellipse(0,4,10,3.2,0,0,6.28); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#FFF6E4'; ctx.beginPath(); roundRect(ctx,-5,-22,10,26,3); ctx.fill(); ctx.stroke();
  // огонёк (мерцает)
  const fl=0.75+0.25*Math.sin(t*9)+0.08*Math.sin(t*23);
  ctx.save(); ctx.translate(0,-24);
  const g=ctx.createRadialGradient(0,-2,1,0,-2,14*fl);
  g.addColorStop(0,'rgba(255,220,140,.55)'); g.addColorStop(1,'rgba(255,220,140,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,-2,14*fl,0,6.28); ctx.fill();
  ctx.fillStyle='#FFB43E';
  ctx.beginPath(); ctx.moveTo(0,4); ctx.quadraticCurveTo(5*fl,-4,0,-10*fl); ctx.quadraticCurveTo(-5*fl,-4,0,4); ctx.fill();
  ctx.fillStyle='#FFF3C2';
  ctx.beginPath(); ctx.moveTo(0,2); ctx.quadraticCurveTo(2.4*fl,-3,0,-6*fl); ctx.quadraticCurveTo(-2.4*fl,-3,0,2); ctx.fill();
  ctx.restore();
  // чашка чая рядом
  ctx.translate(20,2);
  ctx.fillStyle='#E8955A'; ctx.strokeStyle=INK; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(0,0,9,3,0,0,6.28); ctx.fill(); ctx.stroke();
  ctx.beginPath(); roundRect(ctx,-9,0,18,7,2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(10,3,3.4,-1.2,1.2); ctx.stroke();
  ctx.restore();
  // пар
  steam.forEach(s=>{
    s.ph += 0.02*60*0.016*s.sp;
    const sx=candleX+20+Math.sin(s.ph*1.3)*4, sy=candleY - 6 - (s.ph%4)*10;
    const a=Math.max(0,0.35-(s.ph%4)*0.08);
    if(a<=0) return;
    ctx.strokeStyle='rgba(255,255,255,'+a.toFixed(2)+')'; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.quadraticCurveTo(sx+4,sy-6,sx,sy-12); ctx.stroke();
  });
}
function drawCat(t){
  ctx.save(); ctx.translate(catX,catY);
  const breathe=Math.sin(t*1.4)*2;
  ctx.fillStyle=bodyFill(ctx,-4,-6+breathe*0.3,26,16,'#8A7358'); ctx.strokeStyle=INK; ctx.lineWidth=2.6;
  ctx.beginPath(); ctx.ellipse(0,0+breathe*0.3,26,15+breathe*0.4,0,0,6.28); ctx.fill(); ctx.stroke();
  // голова
  ctx.beginPath(); ctx.ellipse(-24,-6,12,10,0,0,6.28); ctx.fill(); ctx.stroke();
  // уши
  ctx.beginPath(); ctx.moveTo(-32,-12); ctx.lineTo(-30,-20); ctx.lineTo(-25,-14); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-20,-13); ctx.lineTo(-16,-19); ctx.lineTo(-15,-12); ctx.closePath(); ctx.fill(); ctx.stroke();
  // хвост
  ctx.strokeStyle=INK; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(20,4); ctx.quadraticCurveTo(34,2,30,-10); ctx.stroke();
  ctx.strokeStyle=shade('#8A7358',.25); ctx.lineWidth=3.4;
  ctx.beginPath(); ctx.moveTo(20,4); ctx.quadraticCurveTo(34,2,30,-10); ctx.stroke();
  // закрытые глазки
  ctx.strokeStyle=INK; ctx.lineWidth=1.6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-29,-6); ctx.quadraticCurveTo(-27,-4,-25,-6); ctx.stroke();
  // zzz
  const zp=(t*0.6)%3;
  if(zp<2){ const a=Math.max(0,1-zp/2);
    ctx.fillStyle='rgba(74,51,35,'+(a*0.8).toFixed(2)+')'; ctx.font='700 '+(9+zp*3)+'px Nunito, sans-serif';
    ctx.fillText('z', -14-zp*3, -20-zp*10);
  }
  ctx.restore();
}
let sparks=[], popups=[];
function sparkleAt(x,y){ for(let i=0;i<6;i++) sparks.push({x:x+rr(-10,10),y:y+rr(-6,6),vy:rr(-40,-70),vx:rr(-20,20),life:1}); }
function popup(x,y,text){ popups.push({x,y,text,life:1}); }
function updateFx(dt){
  for(let i=sparks.length-1;i>=0;i--){ const s=sparks[i]; s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt*1.6; if(s.life<=0) sparks.splice(i,1); }
  for(let i=popups.length-1;i>=0;i--){ const p=popups[i]; p.y-=30*dt; p.life-=dt*1.1; if(p.life<=0) popups.splice(i,1); }
}
function drawFx(){
  sparks.forEach(s=>{ ctx.globalAlpha=Math.max(0,s.life); ctx.fillStyle='#F2C14E'; ctx.beginPath(); ctx.arc(s.x,s.y,2.4,0,6.28); ctx.fill(); ctx.globalAlpha=1; });
  popups.forEach(p=>{ ctx.globalAlpha=Math.max(0,p.life); ctx.font='900 15px Nunito, sans-serif'; ctx.textAlign='center';
    ctx.fillStyle='#F2C14E'; ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.strokeText(p.text,p.x,p.y); ctx.fillText(p.text,p.x,p.y); ctx.globalAlpha=1; });
}
function drawFireflies(t){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  fireflyDust.forEach(f=>{
    const a=0.15+0.15*Math.sin(t*f.sp*3+f.ph);
    ctx.fillStyle='rgba(255,220,150,'+Math.max(0,a).toFixed(2)+')';
    ctx.beginPath(); ctx.arc(f.x+Math.sin(t*f.sp+f.ph)*10, f.y+Math.cos(t*f.sp*0.7+f.ph)*8, 1.6,0,6.28); ctx.fill();
  });
  ctx.restore();
}
function drawVignette(){
  const g=ctx.createRadialGradient(W*0.5,H*0.45,Math.min(W,H)*0.25,W*0.5,H*0.45,Math.max(W,H)*0.78);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(15,8,5,.40)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

// ---------- Главный цикл ----------
let lastT=performance.now(), acc=0, tSec=0;
function frame(now){
  let dt=Math.max(0,Math.min(0.05,(now-lastT)/1000)); lastT=now; tSec+=dt;
  acc+=dt;
  if(acc>=1){ const t=Math.floor(acc); acc-=t; if(ips()>0){ S.coins+=ips()*t; refreshHud(); persist(); } }
  updateFlip(dt); updateFx(dt);
  ctx.clearRect(0,0,W,H);
  drawBackground();
  drawFireflies(tSec);
  drawRain(tSec,dt);
  drawShelf();
  drawCat(tSec);
  drawCandle(tSec);
  drawOpenBook(tSec);
  drawFx();
  drawVignette();
  requestAnimationFrame(frame);
}

// ---------- Подсказка новичку (одноразовая, тап без кнопки) ----------
function maybeHint(){
  if(S.hintShown) return;
  if(S.coins>=60 || S.books.length>1) { S.hintShown=true; return; }
  setTimeout(()=>{
    if(S.hintShown) return;
    if(S.coins<60 && S.books.length<=1){ toast(T("hintTap")); S.hintShown=true; persist(true); }
  }, 2500);
}

// ---------- Тест-хуки ----------
window.render_game_to_text = () => JSON.stringify({
  coins:Math.floor(S.coins), lvl:S.books.length, ips:ips(), upCost:upCost(),
  books:S.books.length, seen:S.seen.length, finger:S.finger, blanket:S.blanket, ink:S.ink,
  tapGain:tapGain(), best:S.best, x2:x2On()
});
window.advanceTime = ms => { S.coins += ips()*(ms/1000); refreshHud(); };
window.__grant = n => { S.coins+=n; refreshHud(); };
window.__buyNextBook = () => { const n=nextBook(); return n? buyBook(n.id) : false; };
window.__buyUp = k => buyUp(k);
window.__flip = () => doFlip();

// ---------- Boot ----------
function boot(raw){
  if(booted) return; booted=true;
  restore(raw);
  document.documentElement.setAttribute("lang", lang());
  resize(); refreshHud();
  $("giftBtn").onclick  = claimGift;
  $("x2Btn").onclick    = claimX2;
  $("shopBtn").onclick  = ()=>openModal('shop');
  $("upBtn").onclick    = ()=>openModal('up');
  $("collBtn").onclick  = ()=>openModal('coll');
  $("langBtn").onclick  = toggleLang;
  $("mClose").onclick   = closeModal;
  $("modal").addEventListener('pointerdown', e=>{ if(e.target.id==='modal') closeModal(); });
  // тап по книге = переворот страницы (без отдельной кнопки)
  cv.addEventListener('pointerdown', e=>{ if(modalOpen) return; doFlip(); });
  checkDaily();
  maybeHint();
  startMusic();
  setInterval(()=>refreshHud(), 1000);
  requestAnimationFrame(frame);
}
(function initSDK(){
  let localRaw=null; try{ localRaw=localStorage.getItem(SAVE_KEY); }catch(e){}
  function start(){
    if(window.YaGames && !window.__noSDK){
      YaGames.init().then(sdk=>{
        ysdk=sdk;
        try{ sdk.features.LoadingAPI && sdk.features.LoadingAPI.ready(); }catch(e){}
        const pReady = sdk.getPlayer({scopes:false}).then(p=>{player=p;return p.getData(["save"]);})
          .then(d=>boot(d&&d.save?d.save:localRaw)).catch(()=>boot(localRaw));
        try{ lb = sdk.leaderboards; }catch(e){}
        return pReady;
      }).catch(()=>boot(localRaw));
      setTimeout(()=>boot(localRaw),4000);
    } else boot(localRaw);
  }
  if(window.__noSDK || window.YaGames) start();
  else window.__onSdkScriptDone = start;
})();
</script>
